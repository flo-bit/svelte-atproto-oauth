name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write       # OIDC for npm trusted publishing
  contents: write       # changesets needs to push branches/tags
  pull-requests: write  # for the "Version Packages" PR

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      # Node 24 ships with npm 11.x, which has trusted publishing support.
      # (Node 22 ships with npm 10.x and the self-upgrade to npm 11 is fragile.)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
